apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: best-cars-mongo-access
spec:
  podSelector:
    matchLabels: {app: best-cars-mongo}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: best-cars-api}
      ports:
        - protocol: TCP
          port: 27017
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: best-cars-api-access
spec:
  podSelector:
    matchLabels: {app: best-cars-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: best-cars-web}
      ports:
        - protocol: TCP
          port: 3030
