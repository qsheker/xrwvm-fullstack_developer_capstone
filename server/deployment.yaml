apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: best-cars-django-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: best-cars-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: best-cars-web
  template:
    metadata:
      labels:
        app: best-cars-web
    spec:
      containers:
        - name: web
          image: us.icr.io/REPLACE_NAMESPACE/best-cars-web:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: best-cars-config
            - secretRef:
                name: best-cars-secrets
          env:
            - name: DJANGO_DB_PATH
              value: /data/db.sqlite3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: best-cars-django-data
---
apiVersion: v1
kind: Service
metadata:
  name: best-cars-web
spec:
  selector:
    app: best-cars-web
  ports:
    - port: 8000
      targetPort: 8000
