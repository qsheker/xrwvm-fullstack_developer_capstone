services:
  mongo_db:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: .
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      MONGO_URL: mongodb://mongo_db:27017/dealershipsDB
      REVIEW_API_KEY: ${REVIEW_API_KEY:?Set REVIEW_API_KEY}
    depends_on:
      mongo_db:
        condition: service_healthy
volumes:
  mongo_data:
